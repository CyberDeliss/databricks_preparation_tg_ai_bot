name: Telegram bot

# Public repo: Actions minutes are unlimited, so a long-lived worker long-polls Telegram
# and replies within seconds. A new worker is scheduled every hour; the `telegram-worker`
# concurrency group keeps exactly one running and one queued, so when a worker hits its
# ~5h40m limit the queued one takes over almost immediately.
# The daily question has its own short runs (GitHub cron is UTC-only: 08:00 and 09:00 UTC,
# the bot sends only on the one that is 10:00 in Belgrade).

on:
  schedule:
    - cron: "0 * * * *"   # keep a worker running
    - cron: "0 8 * * *"   # 10:00 Belgrade in summer (CEST)
    - cron: "0 9 * * *"   # 10:00 Belgrade in winter (CET)
  push:
    branches: [main]
    paths: ["questions/**", "bot.py", ".github/workflows/bot.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "run (start a worker) or daily (send today's question now)"
        default: run

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py check

  worker:
    if: >-
      github.event.schedule == '0 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'run')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: telegram-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Answer messages (long polling)
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
        run: python bot.py run 340

  daily:
    if: >-
      github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send today's question
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python bot.py daily
