name: Telegram bot

# Private repo: 2000 free Actions minutes/month, each run billed as >= 1 minute.
# Polling every 30 minutes (~1440 min/month) plus two short daily runs fits.
# GitHub may delay scheduled runs, so replies can take up to ~30-40 minutes.

on:
  schedule:
    - cron: "*/30 * * * *"   # answer /start, /question and buttons
    - cron: "0 8 * * *"      # 10:00 Belgrade in summer (CEST)
    - cron: "0 9 * * *"      # 10:00 Belgrade in winter (CET); the bot picks the right one
  push:
    branches: [main]
    paths: ["questions/**", "bot.py"]
  workflow_dispatch:
    inputs:
      mode:
        description: "poll or daily"
        default: poll

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py check

  bot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          TG_BOT_SECRET: ${{ secrets.TG_BOT_SECRET }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ github.event.schedule == '*/30 * * * *' && 'poll' || (github.event_name == 'schedule' && 'daily' || inputs.mode) }}
        run: python bot.py "$MODE"
